# Glitch Lead v0 - WSE-STD-PRESET v0
# ===================================
#
# Aggressive lead with risk-driven glitch transitions.
# Demonstrates custom L2 regime graph with 5 states.
#
# State machine:
#   IDLE -> ATTACK -> STABLE <-> GLITCH -> RECOVERY -> STABLE
#                        ^                     |
#                        +---------------------+
#
# Target sound: aggressive digital lead with glitchy breakdowns
# - Fast attack (~5ms)
# - Risk macro triggers glitch state
# - Glitch state uses topology/catastrophe operators
# - Recovery phase smooths back to stable
#
# Macros:
# - RISK: Glitch trigger (> 0.7 enters glitch)
# - BRIGHT: Tilt amount
# - BODY: Density

instrument_ir_v0:
  meta:
    instrument_id: "glitch-lead-v0"
    name: "Glitch Lead"
    version: 0
    author: "symcrash"
    seed_u32: 0xDEADBEEF

  io:
    sample_rate_hz: 48000
    block_size: 64

  layers:
    L0_graph:
      nodes:
        - id: "osc1"
          type: "Osc"
          params:
            waveform: "saw"
        - id: "amp1"
          type: "Amp"
          params:
            adsr:
              a_ms: 5.0
              d_ms: 80.0
              s: 0.7
              r_ms: 150.0
      edges:
        - src: "osc1"
          dst: "amp1"
      macros:
        - id: "M_RISK"
          name: "Risk"
          default: 0.0
        - id: "M_BRIGHT"
          name: "Brightness"
          default: 0.6
        - id: "M_BODY"
          name: "Body"
          default: 0.5

    L2_regimes:
      regime_nodes:
        - id: "R0_IDLE"
          kind: "Idle"
          emit_template: "T_IDLE"

        - id: "R1_ATTACK"
          kind: "Transient"
          emit_template: "T_ATTACK"
          dwell_ms: 15

        - id: "R2_STABLE"
          kind: "StableTone"
          emit_template: "T_STABLE"

        - id: "R3_GLITCH"
          kind: "GlitchChatter"
          emit_template: "T_GLITCH"
          dwell_ms: 80

        - id: "R4_RECOVERY"
          kind: "Recovery"
          emit_template: "T_RECOVERY"
          dwell_ms: 60

      transitions:
        # Normal flow
        - from: "R0_IDLE"
          to: "R1_ATTACK"
          when: "Gate rises"

        - from: "R1_ATTACK"
          to: "R2_STABLE"
          when: "dwell_done"

        # Glitch trigger (risk-driven with hysteresis)
        - from: "R2_STABLE"
          to: "R3_GLITCH"
          when: "risk > 0.7"
          hysteresis:
            enter: 0.7
            exit: 0.3

        # Glitch recovery
        - from: "R3_GLITCH"
          to: "R4_RECOVERY"
          when: "dwell_done"

        - from: "R4_RECOVERY"
          to: "R2_STABLE"
          when: "dwell_done"

        # Note-off from any state
        - from: "any"
          to: "R0_IDLE"
          when: "Gate falls"

    L3_cmmm:
      emit_templates:
        T_IDLE:
          families:
            CONSTRAINT: 1.0
            CALM: 1.0
          ops_enable:
            - "NormalizeScale"
            - "FineClamp"
          trees:
            A: "T1"
            B: "T1"
            beta: 0.0

        T_ATTACK:
          families:
            COLOR: 0.7
            EXCITE: 1.0
            CONSTRAINT: 1.0
          ops_enable:
            - "Tilt"
            - "IntraMix"
            - "NormalizeScale"
            - "FineClamp"
          trees:
            A: "T1"
            B: "T1"
            beta: 0.0

        T_STABLE:
          families:
            COLOR: 0.5
            COHERENCE: 0.4
            CONSTRAINT: 1.0
            CALM: 0.6
          ops_enable:
            - "Tilt"
            - "LowRankMorph"
            - "NormalizeScale"
            - "FineClamp"
            - "SheafProject"
          trees:
            A: "T1"
            B: "T1"
            beta: 0.0

        T_GLITCH:
          families:
            TOPOLOGY: 0.9
            CATASTROPHE: 0.7
            CONSTRAINT: 0.3
            COLOR: 0.3
          ops_enable:
            - "BandShear"
            - "SwapBands"
            - "RotateNodes"
            - "FoldPressure"
            - "FineClamp"
          trees:
            A: "T1"
            B: "T2"
            beta: 0.5

        T_RECOVERY:
          families:
            COHERENCE: 0.5
            CONSTRAINT: 1.0
            CALM: 0.8
          ops_enable:
            - "GluePair"
            - "SheafProject"
            - "NormalizeScale"
            - "FineClamp"
          trees:
            A: "T1"
            B: "T1"
            beta: 0.0
