# Jump Brass v0 - WSE-STD-PRESET v0
# ==================================
#
# Bright unison brass for stabs and hits.
# Uses FM synthesis for that classic 80s "Jump" brass character.
#
# Algorithm 19: Split to 3 Carriers
#   [6] -> [5] -+-> [4*]
#               +-> [3*]
#               +-> [2*]
#               [1*]
#
# Jump Brass FM Strategy:
# -----------------------
# - 4 carriers for thick unison brass
# - Op5 modulates 3 carriers for consistent brightness across section
# - Non-unity ratios (1.5, 2.0) create distinctive brass-synth character
# - Heavier detune than brass_stab for "wall of brass" effect
# - Very fast attack for the iconic "jump" hit
#
# Target sound: Van Halen "Jump" brass / 80s synth brass stab
# - Instant attack (~2ms)
# - Medium decay to bright sustain
# - Very bright, unison brass section

instrument_ir_v0:
  meta:
    instrument_id: "jump-brass-v0"
    name: "Jump Brass"
    version: 0
    author: "symcrash"
    seed_u32: 0x4A554D50

  io:
    sample_rate_hz: 48000
    block_size: 64

  layers:
    L0_graph:
      nodes:
        # 6-operator FM for bright unison brass
        - id: "fm6"
          type: "FM6"
          params:
            algorithm: 19         # Split to 3 carriers (same topology as 22)
            feedback: 3           # Moderate feedback

            # Operator frequency ratios (Q16: 65536 = 1.0x)
            # Heavy carrier detune for thickness, 1:1 modulators for warmth
            # Each 38 Q16 units ≈ 1 cent
            op_ratios:
              - 65536             # Op 1: 1.0x (carrier, anchor)
              - 66106             # Op 2: 1.0087x (carrier, +15 cents)
              - 64966             # Op 3: 0.9913x (carrier, -15 cents)
              - 66486             # Op 4: 1.0145x (carrier, +25 cents)
              - 65536             # Op 5: 1.0x (modulator - warm 2nd harmonic)
              - 65536             # Op 6: 1.0x (modulator - adds body)

            # Operator output levels (Q15)
            # Full carriers, REDUCED mod depth for warmth over brightness
            op_levels:
              - 32767             # Op 1: Full (anchor)
              - 32767             # Op 2: Full (detuned carrier)
              - 32767             # Op 3: Full (detuned carrier)
              - 28672             # Op 4: 0.875 (slightly lower for balance)
              - 10922             # Op 5: 0.33 (subtle warmth)
              - 8192              # Op 6: 0.25 (gentle feedback)

        - id: "amp1"
          type: "Amp"
          params:
            adsr:
              a_ms: 2.0           # Instant "jump" attack
              d_ms: 140.0         # Medium decay
              s: 0.5              # Medium sustain
              r_ms: 100.0         # Clean release

      edges:
        - src: "fm6"
          dst: "amp1"

      macros:
        - id: "M_BRIGHT"
          name: "Brightness"
          default: 0.85
        - id: "M_BODY"
          name: "Body"
          default: 0.5
        - id: "M_DETUNE"
          name: "Unison Spread"
          default: 0.5
        - id: "M_ATTACK"
          name: "Attack"
          default: 0.05
        - id: "M_DECAY"
          name: "Decay"
          default: 0.55
        - id: "M_SUSTAIN"
          name: "Sustain"
          default: 0.5
        - id: "M_RELEASE"
          name: "Release"
          default: 0.35

    L3_cmmm:
      emit_templates:
        T_IDLE:
          families:
            CONSTRAINT: 1.0
            CALM: 1.0
          ops_enable: ["NormalizeScale", "FineClamp"]
          trees:
            A: "T1"
            B: "T1"
            beta: 0.0
        T_ATTACK:
          families:
            COLOR: 0.95
            EXCITE: 1.0
            CONSTRAINT: 1.0
            CALM: 0.05
          ops_enable: ["Tilt", "IntraMix", "Impulse", "GlobalPulse", "NormalizeScale", "FineClamp"]
          trees:
            A: "T1"
            B: "T1"
            beta: 0.25
        T_STABLE:
          families:
            COLOR: 0.85
            COHERENCE: 0.25
            CONSTRAINT: 1.0
            CALM: 0.35
          ops_enable: ["Tilt", "DiffuseDown", "IntraMix", "NormalizeScale", "FineClamp"]
          trees:
            A: "T1"
            B: "T1"
            beta: 0.35
        T_RECOVERY:
          families:
            COHERENCE: 0.25
            CONSTRAINT: 1.0
            CALM: 1.0
          ops_enable: ["GluePair", "SheafProject", "NormalizeScale", "FineClamp"]
          trees:
            A: "T1"
            B: "T1"
            beta: 0.0

  compile:
    completion_policy:
      default_tree:
        A: "T1"
        B: "T1"
        beta: 0.3
