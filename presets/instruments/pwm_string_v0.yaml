# PWM String v0
# Character: Lush analog string pad with movement
# Conformance: P2 (full CMMM synthesis)
#
# Demonstrates LFO modulation system:
# - Vibrato LFO -> pitch (delayed onset)
# - PWM LFO -> pulse width sweep
# - Brightness LFO -> tilt/harmonic content

instrument_ir_v0:
  meta:
    id: "pwm-string-v0"
    name: "PWM String"
    version: 0
    author: "symcrash"
    seed: 0x50574D53

  audio:
    sample_rate: 48000
    block_size: 64

  graph:
    osc1:
      type: Osc
      output: amp1
      waveform: pulse
      pw: 0.5
      harmonic_amps_q15: [32767, 16383, 10922, 8191, 6553, 5461, 4681, 4096]
    amp1:
      type: Amp
      attack: 80.0
      decay: 200.0
      sustain: 0.75
      release: 400.0

  controls:
    Pulse Width: 0.5
    Brightness: 0.5

  modulators:
    vibrato:
      waveform: sine
      rate: 5.5
      depth: 0.2
      delay: 400
      ramp: 300
      sync: free
      targets:
        - pitch: 1.0
    pwm_sweep:
      waveform: triangle
      rate: 0.8
      depth: 0.25
      sync: free
      targets:
        - pwm_width: 1.0
    brightness:
      waveform: sine
      rate: 0.15
      depth: 0.125
      sync: gate_reset
      targets:
        - tilt: 0.5

  behavior:
    idle:
      processing: [FineClamp, NormalizeScale]
      emphasis: {CONSTRAINT: 1.0, CALM: 1.0}
      trees: {A: T1, B: T2, blend: 0.0}
    stable:
      processing: [Tilt, DiffuseDown, FineClamp, NormalizeScale]
      emphasis: {COLOR: 0.5, LOCAL: 0.5, CONSTRAINT: 1.0}
      trees: {A: T1, B: T2, blend: 0.0}
      resolution: 32
      safety: 0
      ramp: 5
      traction: 1.0

  compile:
    material:
      blend: 0.0
      target: 0.75
      ramp: 8
