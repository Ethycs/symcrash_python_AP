# Sub Bass v0 - WSE-STD-PRESET v0
# ================================
#
# Pure fundamental sub bass with minimal harmonics.
# Deep, clean low end for modern productions.
#
# Target sound: pure sub bass
# - Fast attack (~4ms)
# - Quick decay to very high sustain
# - Sine wave (fundamental only)
# Conformance: Basic (static sound)

instrument_ir_v0:
  meta:
    id: "sub-bass-v0"
    name: "Sub Bass"
    version: 0
    author: "symcrash"
    seed: 0x53554242

  audio:
    sample_rate: 48000
    block_size: 64

  graph:
    osc1:
      type: Osc
      output: amp1
      waveform: sine
    amp1:
      type: Amp
      attack: 4.0
      decay: 40.0
      sustain: 0.95
      release: 80.0

  controls:
    Brightness: 0.1
    Body: 0.75

  # 7-axis CMMM voicing: minimal — sub bass wants purity, light body only.
  behavior:
    idle:
      emphasis: {}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    stable:
      emphasis: {body: 0.3}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
