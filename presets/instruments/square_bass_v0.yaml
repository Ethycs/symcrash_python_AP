# Square Bass v0 - WSE-STD-PRESET v0
# ===================================
#
# Classic subtractive bass with square wave character.
# Punchy, solid bass sound with hollow square tone.
#
# Target sound: subtractive square bass
# - Very fast attack (~3ms)
# - Quick decay to high sustain
# - Square wave (odd harmonics only)
# Conformance: Basic (static sound)

instrument_ir_v0:
  meta:
    id: "square-bass-v0"
    name: "Square Bass"
    version: 0
    author: "symcrash"
    seed: 0x53514253

  audio:
    sample_rate: 48000
    block_size: 64

  graph:
    osc1:
      type: Osc
      output: amp1
      waveform: square
    amp1:
      type: Amp
      attack: 3.0
      decay: 35.0
      sustain: 0.85
      release: 40.0

  controls:
    Brightness: 0.25
    Body: 0.6

  # 7-axis CMMM voicing: thick punchy bass (mirrors bass_cheap_v0).
  behavior:
    idle:
      emphasis: {}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    attack:
      emphasis: {body: 0.8}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    stable:
      emphasis: {color: 0.25, body: 0.7}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    recovery:
      emphasis: {body: 0.5}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
