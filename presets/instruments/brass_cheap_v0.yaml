# Brass Cheap v0 - Cheap-First Preset Design
# ===========================================
#
# Synth brass designed for degradation-resilient playback.
# Uses cheap Tier A operators only for core identity.
#
# Operator Philosophy (cheap-first):
# - Core identity: Tilt + IntraMix + DiffuseDown (K-scaling)
# - Garnish (optional): Impulse, GlobalPulse (events - dropped first)
# - Tail: MIN (FineClamp only) for K=16 testing
#
# Acceptance Criteria:
# - STABLE_TONE: K=32 FULL tail = best version
# - TRANSIENT: K=16 MIN tail = still slaps
# - RESIDUAL: emergency = doesn't explode
#
# Algorithm 19 (DX7 Split to 3 Carriers):
#   [6] -> [5] -> [4*]
#              -> [3*]
#              -> [2*]
#          [1*]
# Carriers: Op1-4, Modulators: Op5-6
# Conformance: Expressive (full articulation)

instrument_ir_v0:
  meta:
    id: "brass-cheap-v0"
    name: "Brass Cheap"
    version: 1
    author: "symcrash"
    seed: 0x42524348

  audio:
    sample_rate: 48000
    block_size: 64

  graph:
    fm6:
      type: FM6
      output: amp1
      algorithm: 38  # legacy WSE topology (pre-DX7-table-fix sound, preserved)
      feedback: 1
      operators:
        - ratio: 1.0
          level: 1.0
        - ratio: 1.00145
          level: 1.0
        - ratio: 0.99855
          level: 1.0
        - ratio: 1.0029
          level: 0.875
        - ratio: 1.0
          level: 0.375
        - ratio: 1.0
          level: 0.25
    amp1:
      type: Amp
      attack: 6.0
      decay: 100.0
      sustain: 0.7
      release: 80.0

  controls:
    Brightness: 0.7
    Body: 0.5

  character:
    brightness: 0.7
    density: 0.5
    energy: 0.55
    risk: 0.02
    material: 0.6

  envelopes:
    carrier_env:
      attack: 6.0
      decay: 120.0
      sustain: 0.75
      release: 80.0
      targets: [FM_OP1, FM_OP2, FM_OP3, FM_OP4]
    mod_env:
      attack: 6.0
      decay: 40.0
      sustain: 0.35
      release: 80.0
      targets: [FM_OP5, FM_OP6]

  # Re-voiced to the 7-axis control vector (axes derive processing
  # continuously; safety NormalizeScale+FineClamp is always-on).
  # States that keep an explicit processing: list use a partial operator
  # family (e.g. one diffusion direction) that axes cannot express —
  # the documented escape hatch in docs/jargon.md.
  behavior:
    idle:
      emphasis: {}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    attack:
      emphasis: {color: 0.7, body: 0.6}
      trees: {A: harmonic, B: harmonic, blend: 0.1}
    stable:
      processing: [Tilt, DiffuseDown, IntraMix, FineClamp]
      emphasis: {color: 0.6, body: 0.5, spread: 0.4}
      trees: {A: harmonic, B: harmonic, blend: 0.15}
    recovery:
      processing: [IntraMix, FineClamp]
      emphasis: {}
      trees: {A: harmonic, B: harmonic, blend: 0.0}

  compile:
    material:
      blend: 0.0
      target: 0.125
      ramp: 8
