# Jump Brass v0 - WSE-STD-PRESET v0
# ==================================
#
# Bright unison brass for stabs and hits.
# Uses FM synthesis for that classic 80s "Jump" brass character.
#
# Algorithm 19: Split to 3 Carriers
#   [6] -> [5] -+-> [4*]
#               +-> [3*]
#               +-> [2*]
#               [1*]
#
# Jump Brass FM Strategy:
# -----------------------
# - 4 carriers for thick unison brass
# - Op5 modulates 3 carriers for consistent brightness across section
# - Non-unity ratios (1.5, 2.0) create distinctive brass-synth character
# - Heavier detune than brass_stab for "wall of brass" effect
# - Very fast attack for the iconic "jump" hit
#
# Target sound: Van Halen "Jump" brass / 80s synth brass stab
# - Instant attack (~2ms)
# - Medium decay to bright sustain
# - Very bright, unison brass section
# Conformance: Expressive (full articulation)

instrument_ir_v0:
  meta:
    id: "jump-brass-v0"
    name: "Jump Brass"
    version: 0
    author: "symcrash"
    seed: 0x4A554D50

  audio:
    sample_rate: 48000
    block_size: 64

  graph:
    fm6:
      type: FM6
      output: amp1
      algorithm: 19
      feedback: 3
      operators:
        - ratio: 1.0
          level: 1.0
        - ratio: 1.0087
          level: 1.0
        - ratio: 0.9913
          level: 1.0
        - ratio: 1.0145
          level: 0.87503
        - ratio: 1.0
          level: 0.33332
        - ratio: 1.0
          level: 0.25
    amp1:
      type: Amp
      attack: 2.0
      decay: 140.0
      sustain: 0.5
      release: 100.0

  controls:
    Brightness: 0.85
    Body: 0.5
    Unison Spread: 0.5
    Attack: 0.05
    Decay: 0.55
    Sustain: 0.5
    Release: 0.35

  # Re-voiced to the 7-axis control vector (axes derive processing
  # continuously; safety NormalizeScale+FineClamp is always-on).
  # States that keep an explicit processing: list use a partial operator
  # family (e.g. one diffusion direction) that axes cannot express —
  # the documented escape hatch in docs/jargon.md.
  behavior:
    idle:
      emphasis: {}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    attack:
      processing: [Tilt, IntraMix, Impulse, GlobalPulse, NormalizeScale, FineClamp]
      emphasis: {color: 0.95, snap: 1}
      trees: {A: harmonic, B: harmonic, blend: 0.25}
    stable:
      processing: [Tilt, DiffuseDown, IntraMix, NormalizeScale, FineClamp]
      emphasis: {color: 0.85}
      trees: {A: harmonic, B: harmonic, blend: 0.35}
    recovery:
      emphasis: {glue: 1}
      trees: {A: harmonic, B: harmonic, blend: 0.0}

  compile:
    completion_policy:
      default_tree: {A: T1, B: T1, beta: 0.3}
