# Jump Brass v0 - WSE-STD-PRESET v0
# ==================================
#
# Bright unison brass for stabs and hits.
# Uses FM synthesis for that classic 80s "Jump" brass character.
#
# Algorithm 19: Split to 3 Carriers
#   [6] -> [5] -+-> [4*]
#               +-> [3*]
#               +-> [2*]
#               [1*]
#
# Jump Brass FM Strategy:
# -----------------------
# - 4 carriers for thick unison brass
# - Op5 modulates 3 carriers for consistent brightness across section
# - Non-unity ratios (1.5, 2.0) create distinctive brass-synth character
# - Heavier detune than brass_stab for "wall of brass" effect
# - Very fast attack for the iconic "jump" hit
#
# Target sound: Van Halen "Jump" brass / 80s synth brass stab
# - Instant attack (~2ms)
# - Medium decay to bright sustain
# - Very bright, unison brass section

instrument_ir_v0:
  meta:
    instrument_id: "jump-brass-v0"
    name: "Jump Brass"
    version: 0
    author: "symcrash"
    seed_u32: 0x4A554D50

  io:
    sample_rate_hz: 48000
    block_size: 64

  layers:
    L0_graph:
      nodes:
        # 6-operator FM for bright unison brass
        - id: "fm6"
          type: "FM6"
          params:
            algorithm: 19         # Split to 3 carriers (same topology as 22)
            feedback: 3           # Moderate feedback

            # Operator frequency ratios and output levels
            # Heavy carrier detune for thickness, 1:1 modulators for warmth
            # Full carriers, REDUCED mod depth for warmth over brightness
            operators:
              - ratio: 1.0           # Op1: carrier (anchor, fundamental)
                level: 1.0           # Full output
              - ratio: 1.0087        # Op2: carrier (+15 cents detune)
                level: 1.0           # Full output
              - ratio: 0.9913        # Op3: carrier (-15 cents detune)
                level: 1.0           # Full output
              - ratio: 1.0145        # Op4: carrier (+25 cents detune)
                level: 0.87503       # Slightly lower for balance
              - ratio: 1.0           # Op5: modulator (warm 2nd harmonic)
                level: 0.33332       # Subtle warmth
              - ratio: 1.0           # Op6: modulator (adds body, feedback source)
                level: 0.25          # Gentle feedback level

        - id: "amp1"
          type: "Amp"
          params:
            adsr:
              a_ms: 2.0           # Instant "jump" attack
              d_ms: 140.0         # Medium decay
              s: 0.5              # Medium sustain
              r_ms: 100.0         # Clean release

      edges:
        - src: "fm6"
          dst: "amp1"

      macros:
        - id: "M_BRIGHT"
          name: "Brightness"
          default: 0.85
        - id: "M_BODY"
          name: "Body"
          default: 0.5
        - id: "M_DETUNE"
          name: "Unison Spread"
          default: 0.5
        - id: "M_ATTACK"
          name: "Attack"
          default: 0.05
        - id: "M_DECAY"
          name: "Decay"
          default: 0.55
        - id: "M_SUSTAIN"
          name: "Sustain"
          default: 0.5
        - id: "M_RELEASE"
          name: "Release"
          default: 0.35

    L3_cmmm:
      emit_templates:
        T_IDLE:
          families:
            CONSTRAINT: 1.0
            CALM: 1.0
          ops_enable: ["NormalizeScale", "FineClamp"]
          trees:
            A: "T1"
            B: "T1"
            beta: 0.0
        T_ATTACK:
          families:
            COLOR: 0.95
            EXCITE: 1.0
            CONSTRAINT: 1.0
            CALM: 0.05
          ops_enable: ["Tilt", "IntraMix", "Impulse", "GlobalPulse", "NormalizeScale", "FineClamp"]
          trees:
            A: "T1"
            B: "T1"
            beta: 0.25
        T_STABLE:
          families:
            COLOR: 0.85
            COHERENCE: 0.25
            CONSTRAINT: 1.0
            CALM: 0.35
          ops_enable: ["Tilt", "DiffuseDown", "IntraMix", "NormalizeScale", "FineClamp"]
          trees:
            A: "T1"
            B: "T1"
            beta: 0.35
        T_RECOVERY:
          families:
            COHERENCE: 0.25
            CONSTRAINT: 1.0
            CALM: 1.0
          ops_enable: ["GluePair", "SheafProject", "NormalizeScale", "FineClamp"]
          trees:
            A: "T1"
            B: "T1"
            beta: 0.0

  compile:
    completion_policy:
      default_tree:
        A: "T1"
        B: "T1"
        beta: 0.3
