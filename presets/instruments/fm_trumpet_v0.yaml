# FM Trumpet v0 - InstrumentIR v0
# ================================
#
# Bright trumpet using Algorithm 16 (5 modulators into 1 carrier).
# Maximum harmonic complexity for cutting lead sound.
#
# Algorithm 16: Brass (5 into 1)
#   [6] -+
#   [5] -+
#   [4] -+-> [1*] -> OUT
#   [3] -+
#   [2] -+
#   Feedback on Op6
#
# Key to good FM brass:
# - Integer ratios (1:1, 2:1, 3:1) create harmonic overtones
# - Higher ratios = brighter, more cutting
# - Feedback adds buzz/edge

instrument_ir_v0:
  meta:
    instrument_id: "fm-trumpet-v0"
    name: "FM Trumpet"
    version: 0
    author: "symcrash"
    seed_u32: 0x54525550

  io:
    sample_rate_hz: 48000
    block_size: 64

  layers:
    L0_graph:
      nodes:
        - id: "fm6"
          type: "FM6"
          params:
            algorithm: 16         # 5 modulators into 1 carrier
            feedback: 3           # Moderate feedback for edge

            # Operator frequency ratios (Q16: 65536 = 1.0x)
            # Harmonic series for bright brass
            op_ratios:
              - 65536             # Op1: 1.0x (carrier)
              - 65536             # Op2: 1.0x
              - 131072            # Op3: 2.0x (octave)
              - 196608            # Op4: 3.0x (fifth above octave)
              - 262144            # Op5: 4.0x (2 octaves)
              - 131072            # Op6: 2.0x (with feedback)

            # Operator output levels (Q15: 32767 = 1.0)
            # Carrier full, modulators create harmonic content
            op_levels:
              - 32767             # Op1: Full (carrier)
              - 16384             # Op2: 0.5 (fundamental mod)
              - 13107             # Op3: 0.4 (2nd harmonic)
              - 9830              # Op4: 0.3 (3rd harmonic)
              - 6553              # Op5: 0.2 (4th harmonic)
              - 16384             # Op6: 0.5 (feedback mod)

        - id: "amp1"
          type: "Amp"
          params:
            adsr:
              a_ms: 8.0           # Brass attack
              d_ms: 100.0         # Quick decay
              s: 0.65             # Strong sustain
              r_ms: 150.0         # Release

      edges:
        - src: "fm6"
          dst: "amp1"

      macros:
        - id: "M_BRIGHT"
          name: "Brightness"
          default: 0.8
        - id: "M_EDGE"
          name: "Edge"
          default: 0.6

    L3_cmmm:
      emit_templates:
        T_IDLE:
          families:
            CONSTRAINT: 1.0
            CALM: 1.0
          ops_enable: ["NormalizeScale", "FineClamp"]
          trees:
            A: "T1"
            B: "T1"
            beta: 0.0

        T_STABLE:
          families:
            COLOR: 0.6
            CONSTRAINT: 1.0
            CALM: 0.4
          ops_enable: ["Tilt", "NormalizeScale", "FineClamp"]
          trees:
            A: "T1"
            B: "T1"
            beta: 0.3

  compile:
    material:
      beta_start_q15: 0
      beta_target_q15: 8192
      beta_ramp_blocks: 16
