# FM Trumpet v0 - InstrumentIR v0
# ================================
#
# Bright trumpet using Algorithm 16 (5 modulators into 1 carrier).
# Maximum harmonic complexity for cutting lead sound.
#
# Algorithm 16: Brass (5 into 1)
#   [6] -+
#   [5] -+
#   [4] -+-> [1*] -> OUT
#   [3] -+
#   [2] -+
#   Feedback on Op6
#
# Key to good FM brass:
# - Integer ratios (1:1, 2:1, 3:1) create harmonic overtones
# - Higher ratios = brighter, more cutting
# - Feedback adds buzz/edge
# Conformance: P2 (full CMMM synthesis)

instrument_ir_v0:
  meta:
    id: "fm-trumpet-v0"
    name: "FM Trumpet"
    version: 0
    author: "symcrash"
    seed: 0x54525550

  audio:
    sample_rate: 48000
    block_size: 64

  graph:
    fm6:
      type: FM6
      output: amp1
      algorithm: 16
      feedback: 3
      operators:
        - ratio: 1.0
          level: 1.0
        - ratio: 1.0
          level: 0.5
        - ratio: 2.0
          level: 0.4
        - ratio: 3.0
          level: 0.3
        - ratio: 4.0
          level: 0.2
        - ratio: 2.0
          level: 0.5
    amp1:
      type: Amp
      attack: 8.0
      decay: 100.0
      sustain: 0.65
      release: 150.0

  controls:
    Brightness: 0.8
    Edge: 0.6

  behavior:
    idle:
      processing: [NormalizeScale, FineClamp]
      emphasis: {stability: 1.0, settling: 1.0}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    stable:
      processing: [Tilt, NormalizeScale, FineClamp]
      emphasis: {tone: 0.6, stability: 1.0, settling: 0.4}
      trees: {A: harmonic, B: harmonic, blend: 0.3}

  compile:
    material:
      blend: 0.0
      target: 0.25
      ramp: 16
