# Glitch Lead v0 - WSE-STD-PRESET v0
# ===================================
#
# Aggressive lead with risk-driven glitch transitions.
# Demonstrates custom L2 regime graph with 5 states.
#
# State machine:
#   IDLE -> ATTACK -> STABLE <-> GLITCH -> RECOVERY -> STABLE
#                        ^                     |
#                        +---------------------+
#
# Target sound: aggressive digital lead with glitchy breakdowns
# - Fast attack (~5ms)
# - Risk macro triggers glitch state
# - Glitch state uses topology/catastrophe operators
# - Recovery phase smooths back to stable
#
# Macros:
# - RISK: Glitch trigger (> 0.7 enters glitch)
# - BRIGHT: Tilt amount
# - BODY: Density
# Conformance: Expressive (full articulation)

instrument_ir_v0:
  meta:
    id: "glitch-lead-v0"
    name: "Glitch Lead"
    version: 0
    author: "symcrash"
    seed: 0xDEADBEEF

  audio:
    sample_rate: 48000
    block_size: 64

  graph:
    osc1:
      type: Osc
      output: amp1
      waveform: saw
    amp1:
      type: Amp
      attack: 5.0
      decay: 80.0
      sustain: 0.7
      release: 150.0

  controls:
    Risk: 0.0
    Brightness: 0.6
    Body: 0.5

  behavior:
    states:
      idle: {kind: Idle}
      attack: {kind: Transient, dwell: 15}
      stable: {kind: StableTone}
      glitch: {kind: GlitchChatter, dwell: 80}
      recovery: {kind: Recovery, dwell: 60}

    transitions:
      - from: idle
        to: attack
        when: "Gate rises"
      - from: attack
        to: stable
        when: "dwell_done"
      - from: stable
        to: glitch
        when: "risk > 0.7"
        hysteresis: {enter: 0.7, exit: 0.3}
      - from: glitch
        to: recovery
        when: "dwell_done"
      - from: recovery
        to: stable
        when: "dwell_done"
      - from: any
        to: idle
        when: "Gate falls"

    idle:
      processing: [NormalizeScale, FineClamp]
      emphasis: {stability: 1.0, settling: 1.0}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
      resolution: 8
      safety: MIN
    attack:
      processing: [Tilt, IntraMix, NormalizeScale, FineClamp]
      emphasis: {tone: 0.7, energy: 1.0, stability: 1.0}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
      resolution: 16
      safety: MID
      ramp: 8
    stable:
      processing: [Tilt, LowRankMorph, NormalizeScale, FineClamp, SheafProject]
      emphasis: {tone: 0.5, clarity: 0.4, stability: 1.0, settling: 0.6}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
      resolution: 32
      safety: FULL
      ramp: 12
      traction: 1.0
    glitch:
      processing: [BandShear, SwapBands, RotateNodes, FoldPressure, FineClamp]
      emphasis: {warp: 0.9, chaos: 0.7, stability: 0.3, tone: 0.3}
      trees: {A: harmonic, B: texture, blend: 0.5}
      resolution: 24
      safety: MIN
      ramp: 4
      traction: 0.25
    recovery:
      processing: [GluePair, SheafProject, NormalizeScale, FineClamp]
      emphasis: {clarity: 0.5, stability: 1.0, settling: 0.8}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
      resolution: 32
      safety: FULL
      ramp: 16
      traction: 0.75
