# Wobble Bass v0 - WSE-STD-PRESET v0
# ===================================
#
# LFO-driven filter bass for dubstep/electronic styles.
# Uses tilt modulation to simulate filter wobble.
#
# Target sound: wobble bass / dubstep bass
# - Fast attack (~3ms)
# - Medium decay to high sustain
# - Square wave base
# Conformance: Basic (static sound)

instrument_ir_v0:
  meta:
    id: "wobble-bass-v0"
    name: "Wobble Bass"
    version: 0
    author: "symcrash"
    seed: 0x574F4242

  audio:
    sample_rate: 48000
    block_size: 64

  graph:
    osc1:
      type: Osc
      output: amp1
      waveform: square
    amp1:
      type: Amp
      attack: 3.0
      decay: 80.0
      sustain: 0.92
      release: 90.0

  controls:
    Brightness: 0.2
    Wobble Rate: 0.35

  # 7-axis CMMM voicing: thick body with a snap of attack energy.
  behavior:
    idle:
      emphasis: {}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    attack:
      emphasis: {body: 0.6, snap: 0.4}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    stable:
      emphasis: {body: 0.6}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    recovery:
      emphasis: {body: 0.4}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
