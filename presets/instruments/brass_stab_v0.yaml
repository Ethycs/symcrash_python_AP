# Brass Stab v0 - WSE-STD-PRESET v0
# =================================
#
# Punchy brass section stab using FM synthesis for brass character.
# Uses DX7 Algorithm 22 (classic brass algorithm).
#
# Algorithm 22: Brass (Split 3) - 4 carriers, 2 modulators
#   [6] -> [5] -+-> [4*]
#               +-> [3*]
#               +-> [2*]
#               [1*]
#
# Brass FM Strategy (DX7-derived):
# --------------------------------
# - Op1 is unmodulated carrier at 1:1 (pure fundamental anchor)
# - Op2/3/4 are modulated carriers for harmonic richness
# - Op5 modulator at 1:1 adds 2nd/3rd harmonics
# - Op6 modulator at 2:1 with feedback adds higher partials (brass "edge")
# - Slight carrier detune (+/-3 cents) for ensemble thickness
# - Higher mod index during attack for "blat", decay to sustain for warmth
#
# Target sound: thick brass section stab / horn hit
# - Fast attack with "blat" (~8ms)
# - Quick decay to warm sustain
# - Rich harmonic content with brass edge
# Conformance: Expressive (full articulation)

instrument_ir_v0:
  meta:
    id: "brass-stab-v0"
    name: "Brass Stab"
    version: 0
    author: "symcrash"
    seed: 0x42525353

  audio:
    sample_rate: 48000
    block_size: 64

  graph:
    fm6:
      type: FM6
      output: amp1
      algorithm: 22
      feedback: 4
      operators:
        - ratio: 1.0
          level: 1.0
        - ratio: 1.001
          level: 0.75002
        - ratio: 0.999
          level: 0.75002
        - ratio: 1.00201
          level: 0.62502
        - ratio: 1.0
          level: 0.62502
        - ratio: 2.0
          level: 0.5
    amp1:
      type: Amp
      attack: 8.0
      decay: 85.0
      sustain: 0.55
      release: 95.0

  controls:
    Brightness: 0.75
    Brass Edge: 0.55
    Section Blend: 0.2
    Attack: 0.2
    Decay: 0.35
    Sustain: 0.65
    Release: 0.3
    Detune: 0.02

  # Re-voiced to the 7-axis control vector (axes derive processing
  # continuously; safety NormalizeScale+FineClamp is always-on).
  # States that keep an explicit processing: list use a partial operator
  # family (e.g. one diffusion direction) that axes cannot express —
  # the documented escape hatch in docs/jargon.md.
  behavior:
    idle:
      emphasis: {}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    attack:
      processing: [Tilt, IntraMix, Impulse, GlobalPulse, NormalizeScale, FineClamp]
      emphasis: {color: 0.85, snap: 1}
      trees: {A: harmonic, B: harmonic, blend: 0.15}
    stable:
      processing: [Tilt, DiffuseDown, IntraMix, NormalizeScale, FineClamp]
      emphasis: {color: 0.7}
      trees: {A: harmonic, B: harmonic, blend: 0.25}
    recovery:
      emphasis: {glue: 1}
      trees: {A: harmonic, B: harmonic, blend: 0.0}

  compile:
    completion_policy:
      default_tree: {A: T1, B: T1, beta: 0.2}
