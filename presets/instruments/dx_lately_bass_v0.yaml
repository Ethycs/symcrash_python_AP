# DX Lately Bass v0 - Classic FM Bass
# ====================================
#
# The "Lately Bass" archetype: 2-op FM (algorithm 1, ops 3-6 silent),
# heavy feedback for grit, modulator decays in ~90 ms for the punchy
# rubber attack that softens into a round sustain.
#
# Algorithm 1 (chain, only 2->1 active):
#   [2] -> [1*]
# Conformance: Expressive (full articulation)

instrument_ir_v0:
  meta:
    id: "dx-lately-bass-v0"
    name: "DX Lately Bass"
    version: 2
    author: "symcrash"
    seed: 0x444C4221

  audio:
    sample_rate: 48000
    block_size: 64

  graph:
    fm6:
      type: FM6
      output: amp1
      algorithm: 1
      feedback: 3
      operators:
        # Carrier at 0.5 = full scale. The FM6->FWPT gateway now auto-
        # normalizes carrier sums above 0.5 (no clip distortion); <=0.5
        # renders bit-exactly as before.
        - ratio: 1.0      # Op1 carrier
          level: 0.5
        - ratio: 1.0      # Op2 modulator - punch
          level: 0.68
        - ratio: 1.0
          level: 0.0
        - ratio: 1.0
          level: 0.0
        - ratio: 1.0
          level: 0.0
        - ratio: 1.0
          level: 0.0
    amp1:
      type: Amp
      attack: 1.0
      decay: 220.0
      sustain: 0.45
      release: 80.0

  controls:
    Punch: 0.6
    Body: 0.6

  envelopes:
    mod_env:
      attack: 0.5
      decay: 90.0
      sustain: 0.15
      release: 60.0
      targets: [FM_OP2]

  behavior:
    idle:
      emphasis: {}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    attack:
      emphasis: {snap: 0.5}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    stable:
      emphasis: {}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    recovery:
      emphasis: {}
      trees: {A: harmonic, B: harmonic, blend: 0.0}

  compile:
    material:
      blend: 0.0
      target: 0.0
      ramp: 1
