# Pluck v0 - WSE-STD-PRESET v0
# =============================
#
# Resonant decay pluck for percussive melodic sounds.
# Guitar/harp-like pluck with natural decay.
#
# Target sound: resonant pluck / digital harp
# - Instant attack (~1ms)
# - Long decay to zero (no sustain)
# - Saw harmonics
# Conformance: Basic (static sound)

instrument_ir_v0:
  meta:
    id: "pluck-v0"
    name: "Pluck"
    version: 0
    author: "symcrash"
    seed: 0x504C554B

  audio:
    sample_rate: 48000
    block_size: 64

  graph:
    osc1:
      type: Osc
      output: amp1
      waveform: saw
    amp1:
      type: Amp
      attack: 1.0
      decay: 160.0
      sustain: 0.0
      release: 120.0

  controls:
    Brightness: 0.55
    Decay: 0.5

  # 7-axis CMMM voicing: bright attack settling to mellow sustain
  # (mirrors pluck_cheap_v0).
  behavior:
    idle:
      emphasis: {}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    attack:
      emphasis: {color: 0.5}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    stable:
      emphasis: {color: 0.3}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    recovery:
      emphasis: {}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
