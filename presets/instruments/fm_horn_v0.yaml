# FM French Horn v0 - InstrumentIR v0
# ====================================
#
# Warm, mellow horn using Algorithm 22 with darker settings.
# Sub-harmonic modulator adds body, low feedback for smoothness.
#
# Algorithm 22: Brass (Split 3) - 4 carriers, 2 modulators
#   [6] -> [5] -+-> [4*]
#               +-> [3*]
#               +-> [2*]
#               [1*]
#
# French horn character:
# - Darker than trumpet (lower mod ratios)
# - Sub-harmonic (0.5x) adds warmth
# - Minimal feedback for smooth tone
# - Slight detune for ensemble feel
# Conformance: Expressive (full articulation)

instrument_ir_v0:
  meta:
    id: "fm-horn-v0"
    name: "FM French Horn"
    version: 0
    author: "symcrash"
    seed: 0x484F524E

  audio:
    sample_rate: 48000
    block_size: 64

  graph:
    fm6:
      type: FM6
      output: amp1
      algorithm: 22
      feedback: 1
      operators:
        - ratio: 1.0
          level: 1.0
        - ratio: 1.001
          level: 0.7
        - ratio: 0.999
          level: 0.7
        - ratio: 1.00201
          level: 0.5
        - ratio: 0.5
          level: 0.5
        - ratio: 1.0
          level: 0.3
    amp1:
      type: Amp
      attack: 25.0
      decay: 200.0
      sustain: 0.6
      release: 250.0

  controls:
    Warmth: 0.7
    Body: 0.6

  # Re-voiced to the 7-axis control vector (axes derive processing
  # continuously; safety NormalizeScale+FineClamp is always-on).
  # States that keep an explicit processing: list use a partial operator
  # family (e.g. one diffusion direction) that axes cannot express —
  # the documented escape hatch in docs/jargon.md.
  behavior:
    idle:
      emphasis: {}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    stable:
      emphasis: {color: 0.3}
      trees: {A: harmonic, B: harmonic, blend: 0.15}

  compile:
    material:
      blend: 0.0
      target: 0.125
      ramp: 24
