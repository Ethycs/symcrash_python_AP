# Shear Vox v0 - Wild: vocal formant under band shear
# ====================================================
#
# An "ah"-vowel formant spectrum (bump at H3-H5) smeared by the warp
# axis (BandShear position-dependent rotation) and widened by spread
# (both diffusion directions). The vibrato is vocal: 5 Hz, ~14 cents,
# arriving late and slow like a singer settling onto the note.
# Sounds like a choir transmitted through weather.
# Conformance: Expressive (full articulation)

instrument_ir_v0:
  meta:
    id: "shear-vox-v0"
    name: "Shear Vox"
    version: 1
    author: "symcrash"
    seed: 0x53565658

  audio:
    sample_rate: 48000
    block_size: 64

  graph:
    osc1:
      type: Osc
      output: amp1
      waveform: partials
      partials: [0.8, 0.55, 1.0, 0.95, 0.7, 0.3, 0.18, 0.12, 0.1, 0.08, 0.05, 0.04, 0.0, 0.0, 0.0, 0.0]
      phase_spread: 0.6
    amp1:
      type: Amp
      attack: 60.0
      decay: 300.0
      sustain: 0.8
      release: 500.0

  controls:
    Vowel: 0.5
    Air: 0.5

  modulators:
    lfos:
      - id: "vox_vibrato"
        waveform: "sine"
        rate_hz: 5.0
        # peak cents = 32767 * depth * amount * VIBRATO macro -> ~14 cents
        depth: 0.43
        delay_ms: 250
        ramp_ms: 400
        sync_mode: "free"
        targets:
          - type: "pitch"
            amount: 0.001

  behavior:
    idle:
      emphasis: {}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    attack:
      emphasis: {}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    stable:
      emphasis: {spread: 0.08, warp: 0.06}
      trees: {A: harmonic, B: harmonic, blend: 0.2}
    recovery:
      emphasis: {glue: 0.6}
      trees: {A: harmonic, B: harmonic, blend: 0.0}

  compile:
    material:
      blend: 0.0
      target: 0.0
      ramp: 1
