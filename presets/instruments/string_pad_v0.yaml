# String Pad v0 - WSE-STD-PRESET v0
# ==================================
#
# Analog ensemble string pad with slow, evolving character.
# Lush, warm pad sound with subtle movement.
#
# Target sound: analog string ensemble / pad
# - Slow attack (~160ms)
# - Long decay to high sustain
# - Rich saw harmonics
# Conformance: Basic (static sound)

instrument_ir_v0:
  meta:
    id: "string-pad-v0"
    name: "String Pad"
    version: 0
    author: "symcrash"
    seed: 0x53545250

  audio:
    sample_rate: 48000
    block_size: 64

  graph:
    osc1:
      type: Osc
      output: amp1
      waveform: saw
    amp1:
      type: Amp
      attack: 160.0
      decay: 290.0
      sustain: 0.85
      release: 320.0

  controls:
    Brightness: 0.4
    Body: 0.6

  # 7-axis CMMM voicing: lush width (spread) + body, coherent release (glue).
  behavior:
    idle:
      emphasis: {}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    attack:
      emphasis: {body: 0.5, spread: 0.3}
      trees: {A: harmonic, B: harmonic, blend: 0.1}
    stable:
      emphasis: {body: 0.6, spread: 0.4, glue: 0.4}
      trees: {A: harmonic, B: harmonic, blend: 0.1}
    recovery:
      emphasis: {glue: 0.8}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
