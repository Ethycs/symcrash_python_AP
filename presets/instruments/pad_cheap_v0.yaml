# Pad Cheap v0 - Cheap-First Preset Design
# =========================================
#
# Evolving pad designed for degradation-resilient playback.
# Uses cheap Tier A operators only for core identity.
#
# Operator Philosophy (cheap-first):
# - Core identity: DiffuseUp + IntraMix (air + body)
# - Slow macro motion via family weights
# - Minimal events - pad character from operators alone
# - Tail: MIN (FineClamp only) for K=16 testing
#
# Pad Strategy:
# - DiffuseUp for air and shimmer
# - IntraMix for warmth and coherence
# - Slow attack envelope for pad feel
# - FM6 with detuned ratios for width
#
# Algorithm 32 (DX7 Two-voice):
#   [6] -> [5] -> [4*]
#   [3] -> [2] -> [1*]
# Two detuned carrier streams for pad width
# Conformance: Expressive (full articulation)

instrument_ir_v0:
  meta:
    id: "pad-cheap-v0"
    name: "Pad Cheap"
    version: 0
    author: "symcrash"
    seed: 0x50414443

  audio:
    sample_rate: 48000
    block_size: 64

  graph:
    fm6:
      type: FM6
      output: amp1
      algorithm: 32
      feedback: 0
      operators:
        - ratio: 1.0
          level: 1.0
        - ratio: 1.0
          level: 0.1875
        - ratio: 1.0
          level: 0.125
        - ratio: 1.00145
          level: 1.0
        - ratio: 1.0
          level: 0.1875
        - ratio: 1.0
          level: 0.125
    amp1:
      type: Amp
      attack: 400.0
      decay: 800.0
      sustain: 0.65
      release: 800.0

  controls:
    Shimmer: 0.4
    Warmth: 0.55

  character:
    brightness: 0.3
    density: 0.6
    energy: 0.2
    risk: 0.02
    material: 0.4
    space: 0.5

  envelopes:
    carrier_env:
      attack: 400.0
      decay: 800.0
      sustain: 0.65
      release: 800.0
      targets: [FM_OP1, FM_OP4]
    mod_env:
      attack: 500.0
      decay: 1200.0
      sustain: 0.25
      release: 600.0
      targets: [FM_OP2, FM_OP3, FM_OP5, FM_OP6]

  # Re-voiced to the 7-axis control vector (axes derive processing
  # continuously; safety NormalizeScale+FineClamp is always-on).
  # States that keep an explicit processing: list use a partial operator
  # family (e.g. one diffusion direction) that axes cannot express —
  # the documented escape hatch in docs/jargon.md.
  behavior:
    idle:
      processing: [DiffuseUp, FineClamp]
      emphasis: {spread: 0.2}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    attack:
      processing: [DiffuseUp, IntraMix, FineClamp]
      emphasis: {body: 0.5, spread: 0.4}
      trees: {A: harmonic, B: harmonic, blend: 0.1}
    stable:
      processing: [DiffuseUp, IntraMix, FineClamp]
      emphasis: {body: 0.6, spread: 0.5}
      trees: {A: harmonic, B: harmonic, blend: 0.15}
    recovery:
      processing: [DiffuseUp, IntraMix, FineClamp]
      emphasis: {body: 0.4, spread: 0.3}
      trees: {A: harmonic, B: harmonic, blend: 0.05}

  compile:
    material:
      blend: 0.0
      target: 0.1875
      ramp: 24
