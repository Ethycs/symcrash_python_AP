# OEIS Pad v0 - Golden Ratio Partials
# ====================================
#
# Uses OEIS Beatty sequence for golden ratio (A001950).
# Creates quasi-harmonic, iridescent pad with non-repeating structure.
#
# Active partials: 1, 3, 4, 6, 8, 9, 11, 12, 14, 16, 17, 19...
# Character: Ethereal, shimmering, organic complexity
#
# The golden ratio spacing creates partials that are close to
# harmonic but slightly off, producing a rich, evolving texture.
# Conformance: Expressive (full articulation)

instrument_ir_v0:
  meta:
    id: "oeis-pad-v0"
    name: "OEIS Pad (Golden)"
    version: 0
    author: "symcrash"
    seed: 0x474F4C44

  audio:
    sample_rate: 48000
    block_size: 64

  graph:
    osc1:
      type: Osc
      output: amp1
    amp1:
      type: Amp
      attack: 300.0
      decay: 500.0
      sustain: 0.7
      release: 600.0

  controls:
    Shimmer: 0.5
    Warmth: 0.6

  # Re-voiced to the 7-axis control vector (axes derive processing
  # continuously; safety NormalizeScale+FineClamp is always-on).
  # States that keep an explicit processing: list use a partial operator
  # family (e.g. one diffusion direction) that axes cannot express —
  # the documented escape hatch in docs/jargon.md.
  behavior:
    idle:
      emphasis: {}
      trees: {A: harmonic, B: texture, blend: 0.3}
    stable:
      processing: [Tilt, DiffuseUp, FineClamp]
      emphasis: {color: 0.5}
      trees: {A: harmonic, B: texture, blend: 0.3}

  compile:
    material:
      blend: 0.0
      target: 0.625
      ramp: 16
