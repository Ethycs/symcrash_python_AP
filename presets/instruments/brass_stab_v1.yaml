# Brass Stab v1 - WSE-STD-PRESET v0
# =================================
#
# Aggressive synth brass stab using FM synthesis.
# Uses DX7 Algorithm 16 (5 modulators into 1 carrier).
#
# Algorithm 16: Brass (5 into 1)
#   [6] -+
#   [5] -+
#   [4] -+-> [1*]
#   [3] -+
#   [2] -+
#   (feedback on Op6)
#
# Synth Brass FM Strategy:
# ------------------------
# - Single carrier Op1 receives modulation from ALL other operators
# - Harmonic ratios: 1, 2, 3, 4, 5 create sawtooth-like spectrum
# - Varying modulator levels shape harmonic balance
# - Op6 with 2:1 ratio + feedback for aggressive buzz
# - Result: Oberheim/Prophet-like synth brass
#
# Target sound: aggressive synth brass / lead brass
# - Very fast attack (~3ms)
# - Bright, buzzy sustain
# - Rich harmonic content with "screaming" quality
# Conformance: P2 (full CMMM synthesis)

instrument_ir_v0:
  meta:
    id: "brass-stab-v1"
    name: "Synth Brass"
    version: 1
    author: "symcrash"
    seed: 0x42525354

  audio:
    sample_rate: 48000
    block_size: 64

  graph:
    fm6:
      type: FM6
      output: amp1
      algorithm: 16
      feedback: 5
      operators:
        - ratio: 1.0
          level: 1.0
        - ratio: 2.0
          level: 0.5
        - ratio: 3.0
          level: 0.33335
        - ratio: 4.0
          level: 0.25
        - ratio: 5.0
          level: 0.20002
        - ratio: 2.0
          level: 0.62502
    amp1:
      type: Amp
      attack: 3.0
      decay: 120.0
      sustain: 0.7
      release: 80.0

  controls:
    Brightness: 0.85
    Buzz: 0.7
    Attack: 0.1
    Decay: 0.5
    Sustain: 0.75
    Release: 0.25

  behavior:
    idle:
      processing: [NormalizeScale, FineClamp]
      emphasis: {stability: 1.0, settling: 1.0}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    attack:
      processing: [Tilt, IntraMix, Impulse, GlobalPulse, NormalizeScale, FineClamp]
      emphasis: {tone: 0.9, energy: 1.0, stability: 1.0, settling: 0.1}
      trees: {A: harmonic, B: harmonic, blend: 0.2}
    stable:
      processing: [Tilt, DiffuseDown, IntraMix, NormalizeScale, FineClamp]
      emphasis: {tone: 0.8, clarity: 0.3, stability: 1.0, settling: 0.4}
      trees: {A: harmonic, B: harmonic, blend: 0.3}
    recovery:
      processing: [GluePair, SheafProject, NormalizeScale, FineClamp]
      emphasis: {clarity: 0.3, stability: 1.0, settling: 1.0}
      trees: {A: harmonic, B: harmonic, blend: 0.0}

  compile:
    completion_policy:
      default_tree: {A: T1, B: T1, beta: 0.25}
