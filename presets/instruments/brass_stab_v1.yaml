# Brass Stab v1 - WSE-STD-PRESET v0
# =================================
#
# Aggressive synth brass stab using FM synthesis.
# Uses DX7 Algorithm 16 (5 modulators into 1 carrier).
#
# Algorithm 16: Brass (5 into 1)
#   [6] -+
#   [5] -+
#   [4] -+-> [1*]
#   [3] -+
#   [2] -+
#   (feedback on Op6)
#
# Synth Brass FM Strategy:
# ------------------------
# - Single carrier Op1 receives modulation from ALL other operators
# - Harmonic ratios: 1, 2, 3, 4, 5 create sawtooth-like spectrum
# - Varying modulator levels shape harmonic balance
# - Op6 with 2:1 ratio + feedback for aggressive buzz
# - Result: Oberheim/Prophet-like synth brass
#
# Target sound: aggressive synth brass / lead brass
# - Very fast attack (~3ms)
# - Bright, buzzy sustain
# - Rich harmonic content with "screaming" quality

instrument_ir_v0:
  meta:
    instrument_id: "brass-stab-v1"
    name: "Synth Brass"
    version: 1
    author: "symcrash"
    seed_u32: 0x42525354

  io:
    sample_rate_hz: 48000
    block_size: 64

  layers:
    L0_graph:
      nodes:
        # 6-operator FM - all modulators into one carrier
        - id: "fm6"
          type: "FM6"
          params:
            algorithm: 16         # 5 modulators into 1 carrier
            feedback: 5           # Higher feedback for buzz

            # Operator frequency ratios (Q16: 65536 = 1.0x)
            # Harmonic series for sawtooth-like spectrum
            op_ratios:
              - 65536             # Op 1: 1.0x (carrier)
              - 131072            # Op 2: 2.0x (2nd harmonic)
              - 196608            # Op 3: 3.0x (3rd harmonic)
              - 262144            # Op 4: 4.0x (4th harmonic)
              - 327680            # Op 5: 5.0x (5th harmonic)
              - 131072            # Op 6: 2.0x (with feedback - adds buzz)

            # Operator output levels (Q15)
            # Weighted to approximate 1/n rolloff + boost on feedback mod
            op_levels:
              - 32767             # Op 1: Full (carrier output)
              - 16384             # Op 2: 0.5 (2nd harmonic)
              - 10923             # Op 3: 0.33 (3rd harmonic)
              - 8192              # Op 4: 0.25 (4th harmonic)
              - 6554              # Op 5: 0.2 (5th harmonic)
              - 20480             # Op 6: 0.625 (feedback buzz - louder for edge)

        - id: "amp1"
          type: "Amp"
          params:
            adsr:
              a_ms: 3.0           # Very fast attack
              d_ms: 120.0         # Medium decay
              s: 0.7              # High sustain for lead
              r_ms: 80.0          # Quick release

      edges:
        - src: "fm6"
          dst: "amp1"

      macros:
        - id: "M_BRIGHT"
          name: "Brightness"
          default: 0.85
        - id: "M_BUZZ"
          name: "Buzz"
          default: 0.7
        - id: "M_ATTACK"
          name: "Attack"
          default: 0.1
        - id: "M_DECAY"
          name: "Decay"
          default: 0.5
        - id: "M_SUSTAIN"
          name: "Sustain"
          default: 0.75
        - id: "M_RELEASE"
          name: "Release"
          default: 0.25

    L3_cmmm:
      emit_templates:
        T_IDLE:
          families:
            CONSTRAINT: 1.0
            CALM: 1.0
          ops_enable: ["NormalizeScale", "FineClamp"]
          trees:
            A: "T1"
            B: "T1"
            beta: 0.0
        T_ATTACK:
          families:
            COLOR: 0.9
            EXCITE: 1.0
            CONSTRAINT: 1.0
            CALM: 0.1
          ops_enable: ["Tilt", "IntraMix", "Impulse", "GlobalPulse", "NormalizeScale", "FineClamp"]
          trees:
            A: "T1"
            B: "T1"
            beta: 0.2
        T_STABLE:
          families:
            COLOR: 0.8
            COHERENCE: 0.3
            CONSTRAINT: 1.0
            CALM: 0.4
          ops_enable: ["Tilt", "DiffuseDown", "IntraMix", "NormalizeScale", "FineClamp"]
          trees:
            A: "T1"
            B: "T1"
            beta: 0.3
        T_RECOVERY:
          families:
            COHERENCE: 0.3
            CONSTRAINT: 1.0
            CALM: 1.0
          ops_enable: ["GluePair", "SheafProject", "NormalizeScale", "FineClamp"]
          trees:
            A: "T1"
            B: "T1"
            beta: 0.0

  compile:
    completion_policy:
      default_tree:
        A: "T1"
        B: "T1"
        beta: 0.25
