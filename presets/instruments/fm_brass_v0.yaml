# FM Brass v0 - InstrumentIR v0
# ==============================
#
# FM6 brass stab using DX7 Algorithm 19 (Split to 3 Carriers).
#
# Algorithm 19:
#   [6↺] → [5] → [4*]
#              → [3*]
#              → [2*]
#          [1*]
#
# Carriers: Op1-4 (sum to output)
# Modulators: Op5-6 (create harmonic content)
#
# Target sound: thick brass section stab / horn hit
# - Fast attack with "blat" (~8ms)
# - Quick decay to warm sustain
# - Brightness decay (modulator envelope decays faster than carrier)
#
# Matrix envelope system enables proper FM brass voicing:
# - Carrier envelope: standard ADSR for amplitude
# - Modulator envelope: faster decay for brightness transient
# Conformance: P2 (full CMMM synthesis)

instrument_ir_v0:
  meta:
    id: "fm-brass-v0"
    name: "FM Brass"
    version: 0
    author: "symcrash"
    seed: 0x464D4252

  audio:
    sample_rate: 48000
    block_size: 64

  graph:
    fm6:
      type: FM6
      output: amp1
      algorithm: 19
      feedback: 1
      operators:
        - ratio: 1.0
          level: 1.0
        - ratio: 1.0029
          level: 1.0
        - ratio: 0.9971
          level: 1.0
        - ratio: 1.0058
          level: 0.875
        - ratio: 1.0
          level: 0.33332
        - ratio: 1.0
          level: 0.24998
    amp1:
      type: Amp
      attack: 2.0
      decay: 140.0
      sustain: 0.5
      release: 100.0

  controls:
    Brightness: 0.75
    Brass Edge: 0.55

  character:
    brightness: 0.75
    density: 0.55
    energy_intent: 0.6
    risk: 0.05
    material: 0.65

  envelopes:
    carrier_env:
      attack: 8.0
      decay: 150.0
      sustain: 0.7
      release: 100.0
      targets: [FM_OP1, FM_OP2, FM_OP3, FM_OP4]
    mod_env:
      attack: 8.0
      decay: 50.0
      sustain: 0.3
      release: 100.0
      targets: [FM_OP5, FM_OP6]

  behavior:
    idle:
      processing: [NormalizeScale, FineClamp]
      emphasis: {CONSTRAINT: 1.0, CALM: 1.0}
      trees: {A: T1, B: T1, blend: 0.0}
    stable:
      processing: [Tilt, NormalizeScale, FineClamp]
      emphasis: {COLOR: 0.5, CONSTRAINT: 1.0, CALM: 0.5}
      trees: {A: T1, B: T1, blend: 0.25}

  compile:
    material:
      blend: 0.0
      target: 0.25
      ramp: 16
