# FM Brass v0 - InstrumentIR v0
# ==============================
#
# FM6 brass stab using DX7 Algorithm 22 (classic brass algorithm).
#
# Algorithm 22: Brass (Split 3) - 4 carriers, 2 modulators
#   [6] -> [5] -+-> [4*]
#               +-> [3*]
#               +-> [2*]
#               [1*]
#
# Target sound: thick brass section stab / horn hit
# - Fast attack with "blat" (~8ms)
# - Quick decay to warm sustain
# - Rich harmonic content with brass edge

instrument_ir_v0:
  meta:
    instrument_id: "fm-brass-v0"
    name: "FM Brass"
    version: 0
    author: "symcrash"
    seed_u32: 0x464D4252

  io:
    sample_rate_hz: 48000
    block_size: 64

  layers:
    L0_graph:
      nodes:
        # 6-operator FM for brass character
        - id: "fm6"
          type: "FM6"
          params:
            algorithm: 22         # Classic DX7 brass algorithm
            feedback: 4           # Moderate feedback for brass edge

            # Operator frequency ratios (Q16: 65536 = 1.0x)
            # Carriers mostly 1:1 with slight detune, modulator at 2:1
            op_ratios:
              - 65536             # Op1: 1.0x (carrier, anchor)
              - 65602             # Op2: 1.001x (carrier, +1.7 cents)
              - 65470             # Op3: 0.999x (carrier, -1.7 cents)
              - 65668             # Op4: 1.002x (carrier, +3.4 cents)
              - 65536             # Op5: 1.0x (modulator)
              - 131072            # Op6: 2.0x (modulator, brass edge)

            # Operator output levels (Q15: 32767 = 1.0)
            # Balanced carriers, modulator levels for brass bite
            op_levels:
              - 32767             # Op1: Full (anchor)
              - 24576             # Op2: 0.75 (modulated carrier)
              - 24576             # Op3: 0.75 (modulated carrier)
              - 20480             # Op4: 0.625 (modulated carrier)
              - 20480             # Op5: 0.625 (modulator depth)
              - 16384             # Op6: 0.5 (modulator w/feedback)

        - id: "amp1"
          type: "Amp"
          params:
            adsr:
              a_ms: 8.0           # Fast "blat" onset
              d_ms: 85.0          # Decay to warm sustain
              s: 0.55             # Warm sustain level
              r_ms: 95.0          # Natural brass release

      edges:
        - src: "fm6"
          dst: "amp1"

      macros:
        - id: "M_BRIGHT"
          name: "Brightness"
          default: 0.75
        - id: "M_TEXTURE"
          name: "Brass Edge"
          default: 0.55

    L3_cmmm:
      emit_templates:
        T_IDLE:
          families:
            CONSTRAINT: 1.0
            CALM: 1.0
          ops_enable: ["NormalizeScale", "FineClamp"]
          trees:
            A: "T1"
            B: "T1"
            beta: 0.0

        T_STABLE:
          families:
            COLOR: 0.5
            CONSTRAINT: 1.0
            CALM: 0.5
          ops_enable: ["Tilt", "NormalizeScale", "FineClamp"]
          trees:
            A: "T1"
            B: "T1"
            beta: 0.25

  compile:
    material:
      beta_start_q15: 0
      beta_target_q15: 8192       # Light material blend
      beta_ramp_blocks: 16
