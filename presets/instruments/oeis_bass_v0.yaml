# OEIS Bass v0 - Fibonacci Partials
# ==================================
#
# Uses OEIS Fibonacci sequence (A000045) for partial selection.
# Creates organic, complex bass with increasingly sparse upper partials.
#
# Active partials: 1, 2, 3, 5, 8, 13, 21, ...
# Character: Warm, organic, complex low-end with natural rolloff
#
# Fibonacci spacing creates partials that become progressively sparser,
# resulting in a naturally warm sound with subtle complexity.
# Conformance: Expressive (full articulation)

instrument_ir_v0:
  meta:
    id: "oeis-bass-v0"
    name: "OEIS Bass (Fibonacci)"
    version: 0
    author: "symcrash"
    seed: 0x46494253

  audio:
    sample_rate: 48000
    block_size: 64

  graph:
    osc1:
      type: Osc
      output: amp1
    amp1:
      type: Amp
      attack: 5.0
      decay: 200.0
      sustain: 0.8
      release: 150.0

  controls:
    Drive: 0.3
    Weight: 0.7

  # Re-voiced to the 7-axis control vector (axes derive processing
  # continuously; safety NormalizeScale+FineClamp is always-on).
  # States that keep an explicit processing: list use a partial operator
  # family (e.g. one diffusion direction) that axes cannot express —
  # the documented escape hatch in docs/jargon.md.
  behavior:
    idle:
      emphasis: {}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    stable:
      emphasis: {body: 0.5}
      trees: {A: harmonic, B: harmonic, blend: 0.0}

  compile:
    material:
      blend: 0.0
      target: 0.5
      ramp: 4
