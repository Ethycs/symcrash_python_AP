# OEIS Bass v0 - Fibonacci Partials
# ==================================
#
# Uses OEIS Fibonacci sequence (A000045) for partial selection.
# Creates organic, complex bass with increasingly sparse upper partials.
#
# Active partials: 1, 2, 3, 5, 8, 13, 21, ...
# Character: Warm, organic, complex low-end with natural rolloff
#
# Fibonacci spacing creates partials that become progressively sparser,
# resulting in a naturally warm sound with subtle complexity.
# Conformance: P2 (full CMMM synthesis)

instrument_ir_v0:
  meta:
    id: "oeis-bass-v0"
    name: "OEIS Bass (Fibonacci)"
    version: 0
    author: "symcrash"
    seed: 0x46494253

  audio:
    sample_rate: 48000
    block_size: 64

  graph:
    osc1:
      type: Osc
      output: amp1
    amp1:
      type: Amp
      attack: 5.0
      decay: 200.0
      sustain: 0.8
      release: 150.0

  controls:
    Drive: 0.3
    Weight: 0.7

  behavior:
    idle:
      processing: [FineClamp]
      emphasis: {stability: 1.0, settling: 1.0}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    stable:
      processing: [IntraMix, FineClamp]
      emphasis: {body: 0.5, stability: 1.0, settling: 0.5}
      trees: {A: harmonic, B: harmonic, blend: 0.0}

  compile:
    material:
      blend: 0.0
      target: 0.5
      ramp: 4
