# Pluck Cheap v0 - Cheap-First Preset Design
# ===========================================
#
# Percussive pluck designed for degradation-resilient playback.
# Uses cheap Tier A operators only for core identity.
#
# Operator Philosophy (cheap-first):
# - Core identity lives in envelope + spectral setup
# - Minimal operators - pluck character from ADSR
# - Optional Impulse as garnish (dropped first under budget)
# - Tail: MIN (FineClamp only) for K=16 testing
#
# Pluck Strategy:
# - Instant attack, long decay to zero sustain
# - Brightness decay via mod envelope (faster than carrier)
# - Core must "pluck" even without operators
# - Light Tilt for spectral character
#
# Algorithm 22 (DX7 Rhodes-like):
#   [6] -> [5] -> [4*]
#          [3] -> [2*]
#                 [1*]
# Multiple carriers for rich harmonic decay
# Conformance: Expressive (full articulation)

instrument_ir_v0:
  meta:
    id: "pluck-cheap-v0"
    name: "Pluck Cheap"
    version: 0
    author: "symcrash"
    seed: 0x504C4348

  audio:
    sample_rate: 48000
    block_size: 64

  graph:
    fm6:
      type: FM6
      output: amp1
      algorithm: 22
      feedback: 0
      operators:
        - ratio: 1.0
          level: 1.0
        - ratio: 1.0
          level: 0.75002
        - ratio: 2.0
          level: 0.5
        - ratio: 1.0
          level: 0.62502
        - ratio: 3.0
          level: 0.375
        - ratio: 4.0
          level: 0.25
    amp1:
      type: Amp
      attack: 1.0
      decay: 300.0
      sustain: 0.0
      release: 100.0

  controls:
    Brightness: 0.6
    Decay: 0.5

  character:
    brightness: 0.6
    density: 0.4
    energy: 0.7
    risk: 0.01
    material: 0.55

  envelopes:
    carrier_env:
      attack: 1.0
      decay: 300.0
      sustain: 0.0
      release: 100.0
      targets: [FM_OP1, FM_OP2, FM_OP4]
    mod_env:
      attack: 1.0
      decay: 80.0
      sustain: 0.0
      release: 50.0
      targets: [FM_OP3, FM_OP5, FM_OP6]

  # Re-voiced to the 7-axis control vector (axes derive processing
  # continuously; safety NormalizeScale+FineClamp is always-on).
  # States that keep an explicit processing: list use a partial operator
  # family (e.g. one diffusion direction) that axes cannot express —
  # the documented escape hatch in docs/jargon.md.
  behavior:
    idle:
      emphasis: {}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    attack:
      emphasis: {color: 0.5}
      trees: {A: harmonic, B: harmonic, blend: 0.05}
    stable:
      emphasis: {color: 0.3}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    recovery:
      emphasis: {}
      trees: {A: harmonic, B: harmonic, blend: 0.0}

  compile:
    material:
      blend: 0.0
      target: 0.09375
      ramp: 4
