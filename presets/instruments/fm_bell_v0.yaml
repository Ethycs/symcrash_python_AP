# FM Bell v0 - WSE-STD-PRESET v0
# ===============================
#
# DX7-style FM bell using 6-operator FM synthesis.
# Classic electric piano / bell timbre with inharmonic partials.
#
# Algorithm 5: Dual modulator stacks into single carrier
#   [6] -> [5] -> [4] -+
#                      +-> [1] -> OUT
#   [3] -> [2] --------+
#
# This creates the characteristic "clang" of FM bells:
# - Op 1: Carrier (fundamental)
# - Op 2,4: Modulators at 1:1 ratio (adds harmonics)
# - Op 3,5,6: Higher ratio modulators (inharmonic content)
#
# Target sound: DX7 E.Piano / Tubular Bell
# - Instant attack (~1ms)
# - Long decay to zero
# - Inharmonic bell-like partials
# Conformance: Basic (static sound)

instrument_ir_v0:
  meta:
    id: "fm-bell-v0"
    name: "FM Bell"
    version: 1
    author: "symcrash"
    seed: 0x464D424C

  audio:
    sample_rate: 48000
    block_size: 64

  graph:
    fm6:
      type: FM6
      output: amp1
      algorithm: 35  # legacy WSE topology (pre-DX7-table-fix sound, preserved)
      feedback: 1
      operators:
        - ratio: 1.0
          level: 1.0
        - ratio: 1.0
          level: 0.25
        - ratio: 3.5
          level: 0.2
        - ratio: 2.0
          level: 0.33332
        - ratio: 4.5
          level: 0.15
        - ratio: 14.0
          level: 0.09998
    amp1:
      type: Amp
      attack: 1.0
      decay: 800.0
      sustain: 0.0
      release: 400.0

  controls:
    Brightness: 0.5
    FM Index: 0.6

  # 7-axis CMMM voicing: gentle spectral tilt for bell shimmer.
  behavior:
    idle:
      emphasis: {}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    stable:
      emphasis: {color: 0.4}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
