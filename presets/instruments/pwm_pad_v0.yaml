# PWM Pad v0 - WSE-STD-PRESET v0
# ===============================
#
# Pulse width modulation pad with evolving character.
# Rich, animated pad sound with PWM-style movement.
#
# Target sound: PWM pad / chorus strings
# - Slow attack (~100ms)
# - Long decay to high sustain
# - Pulse wave base
# Conformance: Basic (static sound)

instrument_ir_v0:
  meta:
    id: "pwm-pad-v0"
    name: "PWM Pad"
    version: 0
    author: "symcrash"
    seed: 0x50574D50

  audio:
    sample_rate: 48000
    block_size: 64

  graph:
    osc1:
      type: Osc
      output: amp1
      waveform: pulse
      pw: 0.5
    amp1:
      type: Amp
      attack: 100.0
      decay: 260.0
      sustain: 0.85
      release: 320.0

  controls:
    Brightness: 0.4
    PWM Depth: 0.45

  # 7-axis CMMM voicing: air (spread) + warmth (body), mirrors pad_cheap_v0.
  behavior:
    idle:
      emphasis: {spread: 0.2}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
    attack:
      emphasis: {body: 0.5, spread: 0.4}
      trees: {A: harmonic, B: harmonic, blend: 0.1}
    stable:
      emphasis: {body: 0.6, spread: 0.5}
      trees: {A: harmonic, B: harmonic, blend: 0.15}
    recovery:
      emphasis: {body: 0.4, spread: 0.3}
      trees: {A: harmonic, B: harmonic, blend: 0.05}
