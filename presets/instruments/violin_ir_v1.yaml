# Violin IR v1 - InstrumentIR v0
# ==============================
#
# Expressive bowed-string with organic character.
# Uses Mode B synthesis with custom harmonic profile.
#
# Target sound: solo violin with natural character
# - Slow attack (~30ms) for bow contact
# - Rich harmonics from real violin analysis
# - High sustain for bowed string
# - Long release for natural decay
#
# Custom harmonic profile from real violin analysis:
# H1=94%, H2=100%, H3=21%, H4=73%, H5=11%, H6=19%, H7=4%, H8=4%
# Conformance: P2 (full CMMM synthesis)

instrument_ir_v0:
  meta:
    id: "violin-ir-v1"
    name: "Violin IR"
    version: 1
    author: "symcrash"
    seed: 0x56494F4C

  audio:
    sample_rate: 48000
    block_size: 64

  graph:
    osc1:
      type: Osc
      output: amp1
      waveform: partials
      partials: [0.943, 1.0, 0.211, 0.731, 0.112, 0.187, 0.036, 0.037]
    amp1:
      type: Amp
      attack: 30.0
      decay: 250.0
      sustain: 0.8
      release: 550.0

  controls:
    Vibrato: 0.5
    Brightness: 0.5
    Body: 0.5
    Attack: 0.25
    Release: 0.45

  behavior:
    idle:
      processing: [NormalizeScale, FineClamp]
      emphasis: {stability: 1.0, settling: 1.0}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
      resolution: 8
      safety: MIN
    stable:
      processing: [NormalizeScale, FineClamp]
      emphasis: {stability: 1.0, settling: 0.8}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
      resolution: 32
      safety: FULL
      ramp: 15
      traction: 1.0

  compile:
    material:
      blend: 0.0
      target: 0.0
      ramp: 1
