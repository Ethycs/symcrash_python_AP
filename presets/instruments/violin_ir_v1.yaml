# Violin IR v1 - InstrumentIR v0
# ==============================
#
# Expressive bowed-string with organic character.
# Uses Mode B synthesis with custom harmonic profile.
#
# Target sound: solo violin with natural character
# - Slow attack (~30ms) for bow contact
# - Rich harmonics from real violin analysis
# - High sustain for bowed string
# - Long release for natural decay
#
# Custom harmonic profile measured from violin.wav (A4=440, repo root):
# H1-H12: 1.000 0.093 0.085 0.177 0.275 0.136 0.021 0.093 0.024 0.012 0.015 0.004
# (dominant fundamental, weak H2/H3, formant bump at H4-H6)
# Previous v1 partials (H2=1.0) were wrong vs the real analysis.
# Vibrato: 6 Hz, ~22 cents, fading in ~0.35 s after the attack — now rendered
# in-engine (phase-continuous cents path), no audio-domain post-processing.
# Conformance: Expressive (full articulation)

instrument_ir_v0:
  meta:
    id: "violin-ir-v1"
    name: "Violin IR"
    version: 2
    author: "symcrash"
    seed: 0x56494F4C

  audio:
    sample_rate: 48000
    block_size: 64

  graph:
    osc1:
      type: Osc
      output: amp1
      waveform: partials
      partials: [1.0, 0.093, 0.085, 0.177, 0.275, 0.136, 0.021, 0.093, 0.024, 0.012, 0.015, 0.004]
    amp1:
      type: Amp
      attack: 30.0
      decay: 250.0
      sustain: 0.8
      release: 550.0

  controls:
    Vibrato: 0.5
    Brightness: 0.5
    Body: 0.5
    Attack: 0.25
    Release: 0.45

  modulators:
    lfos:
      - id: "vibrato"
        waveform: "sine"
        rate_hz: 6.0
        # peak cents = 32767 * depth * amount * VIBRATO macro -> ~22 cents
        depth: 0.67
        delay_ms: 150
        ramp_ms: 350
        sync_mode: "free"
        targets:
          - type: "pitch"
            amount: 0.001

  # Re-voiced to the 7-axis control vector (axes derive processing
  # continuously; safety NormalizeScale+FineClamp is always-on).
  # States that keep an explicit processing: list use a partial operator
  # family (e.g. one diffusion direction) that axes cannot express —
  # the documented escape hatch in docs/jargon.md.
  behavior:
    idle:
      emphasis: {}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
      resolution: 8
      safety: MIN
    stable:
      emphasis: {}
      trees: {A: harmonic, B: harmonic, blend: 0.0}
      resolution: 32
      safety: FULL
      ramp: 15
      traction: 1.0

  compile:
    material:
      blend: 0.0
      target: 0.0
      ramp: 1
