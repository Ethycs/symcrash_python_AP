# Portamento Slow v0 - MacroIR v0
# ================================
#
# Slow portamento for expressive slides.
# Can be applied to any instrument preset.
#
# Macro Type: PORTAMENTO
# - Pitch glide between all notes (not just legato)
# - Slow glide for expressive effect
# - Exponential curve for natural feel

macro_ir_v0:
  meta:
    macro_id: "portamento-slow-v0"
    name: "Slow Portamento"
    version: 0
    author: "symcrash"
    description: "Slow portamento with exponential glide curve."

  macro:
    macro_type: PORTAMENTO

    # Pitch glide parameters
    glide_time_ms: 200.0      # Slow 200ms glide
    glide_curve: 1            # 1=exponential curve

    # Phase behavior
    preserve_phase: false     # Retrigger on each note

  tags:
    - portamento
    - glide
    - slow
    - expressive
