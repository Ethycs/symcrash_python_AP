# Tremolo Fast v0 - MacroIR v0
# =============================
#
# Fast tremolo for dramatic effect.
# Can be applied to any instrument preset.
#
# Macro Type: TREMOLO
# - Amplitude-only modulation (no pitch wobble)
# - Fast rate for dramatic trembling effect
# - Immediate onset

macro_ir_v0:
  meta:
    macro_id: "tremolo-fast-v0"
    name: "Fast Tremolo"
    version: 0
    author: "symcrash"
    description: "Fast tremolo with amplitude-only modulation."

  macro:
    macro_type: TREMOLO

    # LFO parameters
    rate_hz: 8.0              # Fast tremolo rate
    depth_pitch_cents: 0      # No pitch modulation
    depth_amp_q15: 8192       # 25% amplitude modulation
    depth_timbre_q15: 0       # No timbre modulation

    # Envelope parameters
    delay_ms: 0.0             # Immediate onset
    ramp_ms: 10.0             # Quick ramp

  tags:
    - tremolo
    - fast
    - dramatic
    - strings
