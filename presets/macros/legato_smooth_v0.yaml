# Legato Smooth v0 - MacroIR v0
# ==============================
#
# Smooth legato mode with phase preservation.
# Can be applied to any instrument preset.
#
# Macro Type: LEGATO
# - Preserves oscillator phase on note transitions
# - Smooth pitch glide between notes
# - No re-trigger of envelope on legato notes

macro_ir_v0:
  meta:
    macro_id: "legato-smooth-v0"
    name: "Smooth Legato"
    version: 0
    author: "symcrash"
    description: "Smooth legato with phase preservation and pitch glide."

  macro:
    macro_type: LEGATO

    # Pitch glide parameters
    glide_time_ms: 50.0       # 50ms glide between notes
    glide_curve: 0            # 0=linear, 1=exp, 2=log

    # Phase behavior
    preserve_phase: true      # Keep oscillator phase on note change

  tags:
    - legato
    - smooth
    - monophonic
    - expressive
