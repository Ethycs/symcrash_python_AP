[project]
authors = [{name = "Ethycs", email = "Ethycs@users.noreply.github.com"}]
name = "symcrash_python_AP"
requires-python = ">= 3.11"
version = "0.1.0"
dependencies = ["sounddevice>=0.5.3,<0.6", "imgui-bundle>=1.92.5,<2", "python-osc>=1.9.3,<2", "ruamel.yaml>=0.18,<0.19"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[tool.pixi.pypi-dependencies]
symcrash_python_ap = { path = ".", editable = true }

[tool.pixi.tasks]
# === Live Synth Tasks ===
# Hardware control via Pico2 potentiometers (console only)
live-synth = "python tools/synth/pico2_live_synth.py"
# Hardware control + ImGui window for visual feedback
live-synth-imgui = "python tools/synth/pico2_live_synth.py --imgui"

# === Virtual Synth Tasks (no hardware needed) ===
# Virtual synth with ImGui knobs for control
virtual-synth = "python tools/synth/pico2_live_synth.py --no-hardware --imgui"
# Virtual synth with multiprocessing (lower latency, no ImGui)
virtual-synth-mp = "python tools/synth/virtual_synth_mp.py"

# === Standalone Tools ===
# ImGui control panel (standalone, sends UART to hardware)
imgui-controls = "python -m symcrash_imgui_controls"
# OSC tuning workbench (Open Stage Control front-end)
workbench = "python -m symcrash_workbench"
# Portable Windows UI bootstrap/launcher (installed under ignored .pixi/)
workbench-ui = "pwsh -NoProfile -File tools/workbench/launch_open_stage_control.ps1"

# === Development Tasks ===
test = "python -m pytest tests/ -v"
check-hardware-resources = "python tools/check_hardware_resources.py"
check-hdl = "python tools/check_hdl_idwpt.py"
synth-hdl = "python tools/synth_hdl_idwpt.py"
route-hdl = "python tools/route_hdl_idwpt.py"
check-hdl-dma = "python tools/check_hdl_dma.py"
check-hdl-dma-bounds = "python tools/check_hdl_dma_bounds.py"
check-hdl-control = "python tools/check_hdl_control.py"
check-hdl-fifo = "python tools/check_hdl_fifo.py"
synth-hdl-dma = "python tools/build_hdl_dma.py synth"
route-hdl-dma = "python tools/build_hdl_dma.py route"
check-hdl-dma-priority = "python tools/check_hdl_dma_priority.py"
synth-hdl-dma-priority = "python tools/build_hdl_dma_priority.py synth"
route-hdl-dma-priority = "python tools/build_hdl_dma_priority.py route"
check-hdl-coeff-buffers = "python tools/check_hdl_coeff_buffers.py"
synth-hdl-coeff-buffers = "python tools/build_hdl_coeff_buffers.py synth"
route-hdl-coeff-buffers = "python tools/build_hdl_coeff_buffers.py route"
check-hdl-ccs-stream = "python tools/check_hdl_ccs_stream.py"
synth-hdl-ccs-stream = "python tools/build_hdl_ccs_stream.py synth"
route-hdl-ccs-stream = "python tools/build_hdl_ccs_stream.py route"
check-hdl-dma-window = "python tools/check_hdl_dma_window.py"
synth-hdl-dma-window = "python tools/build_hdl_dma_window.py synth"
route-hdl-dma-window = "python tools/build_hdl_dma_window.py route"
lint = "python tools/lint_presets.py presets/instruments/ -v"
render-all = "python tools/render/render_all_presets.py"
score-audio = "python tools/gym/timbre_distance.py"
auto-refine = "python tools/gym/auto_refine.py"
dx7-core-refine = "python tools/gym/dx7_core_refine.py"

[tool.pixi.feature.scoring.tasks]
zimtohrli-worker = "python tools/gym/zimtohrli_worker.py"

[tool.pixi.dependencies]
python = ">=3.14.2,<3.15"
numpy = ">=2.3.5,<3"
pytest = ">=9.0.2,<10"
pyserial = ">=3.5,<4"
numba = ">=0.60.0,<1"
scipy = ">=1.16.3,<2"
pyyaml = ">=6.0.3,<7"

[tool.pixi.feature.scoring.target.linux-64.dependencies]
python = "3.12.*"
numpy = "*"

[tool.pixi.feature.scoring.target.linux-64.pypi-dependencies]
zimtohrli = "==0.2.1.post1"

[tool.pixi.feature.dexed.target.linux-64.dependencies]
python = "3.12.*"
numpy = "*"

[tool.pixi.feature.dexed.target.linux-64.pypi-dependencies]
pedalboard = "*"
mido = "*"
soundfile = "*"

[tool.pixi.environments]
scoring = { features = ["scoring"], no-default-feature = true }
dexed = { features = ["dexed"], no-default-feature = true }
