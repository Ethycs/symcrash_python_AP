[project]
authors = [{name = "Ethycs", email = "Ethycs@users.noreply.github.com"}]
name = "symcrash_python_AP"
requires-python = ">= 3.11"
version = "0.1.0"
dependencies = ["sounddevice>=0.5.3,<0.6", "imgui-bundle>=1.92.5,<2"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.pypi-dependencies]
symcrash_python_ap = { path = ".", editable = true }

[tool.pixi.tasks]
# Virtual synth with multiprocessing (zero GIL contention)
virtual-synth-mp = "python tools/virtual_synth_mp.py"
# Virtual synth with ImGui controls (threaded, may have latency)
virtual-synth = "python tools/pico2_live_synth.py --imgui --no-hardware"
# ImGui control interface (standalone - connects to hardware via UART)
imgui-controls = "python -m symcrash_imgui_controls"
# Live synth with ImGui control window (hardware + virtual)
live-synth-imgui = "python tools/pico2_live_synth.py --imgui"
# Live synth console-only (no GUI)
live-synth = "python tools/pico2_live_synth.py"

[tool.pixi.dependencies]
python = ">=3.14.2,<3.15"
numpy = ">=2.3.5,<3"
pytest = ">=9.0.2,<10"
pyserial = ">=3.5,<4"
